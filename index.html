      isolation: isolate;

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, #102b1b55, transparent 65%),
                  linear-gradient(0deg, #142a1b55, transparent 55%);
    }

    .message {
      position: absolute;
      top: 28px;
      left: 30px;
      max-width: 310px;
      padding: 15px 19px;
      color: var(--green);
      background: #fff8e9e8;
      border: 2px solid #e8c879;
      border-radius: 18px 18px 18px 5px;
      box-shadow: 0 5px 18px #142a1b33;
    }

    .message h1 {
      margin: 0 0 5px;
      font-size: clamp(21px, 4vw, 30px);
    }

    .message p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .clock-card {
      position: absolute;
      right: clamp(18px, 5vw, 48px);
      bottom: 28px;
      width: 245px;
      padding: 17px 18px 15px;
      text-align: center;
      color: var(--green);
      background: #fff8e9ed;
      border: 3px solid var(--gold);
      border-radius: 25px;
      box-shadow: 0 10px 30px #142a1b55;
      backdrop-filter: blur(5px);
    }

    .clock-face {
      position: relative;
      width: 174px;
      height: 174px;
      margin: 0 auto 12px;
      border: 7px solid #b58a45;
      border-radius: 50%;
      background: radial-gradient(circle, #fffdf5 0 68%, #f3e5c5 69% 100%);
      box-shadow: inset 0 0 0 2px #e2c98e, 0 4px 12px #6b513333;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 8px;
      border-radius: 3px;
      background: #98743d;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-73px);
    }

    .numeral {
      position: absolute;
      left: 50%;
      top: 50%;
      color: #496044;
      font-size: 14px;
      font-weight: bold;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-57px) rotate(calc(-1 * var(--angle)));
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      z-index: 3;
      border-radius: 8px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
    }

    .hour-hand { width: 6px; height: 43px; background: #31543b; }
    .minute-hand { width: 4px; height: 59px; background: #9a7138; }
    .second-hand { width: 2px; height: 65px; background: #d16f55; }

    .hub {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      width: 11px;
      height: 11px;
      border: 2px solid #fff8e9;
      border-radius: 50%;
      background: #d16f55;
      transform: translate(-50%, -50%);
    }

    .digital {
      margin: 2px 0 3px;
      color: #31543b;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-bottom: 12px;
      color: #806744;
      font-size: 12px;
      text-transform: capitalize;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    button {
      padding: 8px 11px;
      border: 1px solid #b58a45;
      border-radius: 999px;
      color: #fff8e9;
      background: #496747;
      font: 12px Arial, sans-serif;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    button:hover { background: #31543b; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #d16f55; outline-offset: 3px; }

    .footer-note {
      margin-top: 10px;
      color: #806744;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .night .clock-card { background: #203629ed; color: #f8edcf; }
    .night .clock-face { background: #e9dfc6; }
    .night .digital { color: #fff0c9; }
    .night .date, .night .footer-note { color: #e5c98c; }
    .night .message { background: #203629ed; color: #fff0c9; }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .scene { min-height: 690px; background-position: 48% center; }
      .message { top: 15px; left: 15px; right: 15px; max-width: none; }
      .clock-card { right: 50%; bottom: 18px; transform: translateX(50%); }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <section class="message">
      <h1>Hora de voar! 🪶</h1>
      <p>Um cantinho da floresta para acompanhar o seu tempo.</p>
    </section>

    <section class="clock-card" aria-label="Relógio interativo">
      <div class="clock-face" aria-hidden="true">
        <div id="ticks"></div>
        <div id="numerals"></div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        <div class="hub"></div>
      </div>

      <div class="digital" id="digitalTime">00:00:00</div>
      <div class="date" id="dateText"></div>

      <div class="controls">
        <button id="formatButton" type="button">Formato 24h</button>
        <button id="pauseButton" type="button">Pausar</button>
        <button id="themeButton" type="button">Modo noturno</button>
      </div>
      <div class="footer-note">♥ Harpia • natureza • tempo ♥</div>
    </section>
  </main>

  <script>
    // Desenha as 12 marcas e os 12 números do mostrador.
    const ticks = document.getElementById("ticks");
    const numerals = document.getElementById("numerals");
    const roman = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];

    for (let i = 0; i < 12; i++) {
      const mark = document.createElement("span");
      mark.className = "tick";
      mark.style.setProperty("--angle", `${i * 30}deg`);
      ticks.appendChild(mark);

      const number = document.createElement("span");
      number.className = "numeral";
      number.textContent = roman[i];
      number.style.setProperty("--angle", `${i * 30}deg`);
      numerals.appendChild(number);
    }

    // Guarda os elementos e o estado dos controles.
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const secondHand = document.getElementById("secondHand");
    const digitalTime = document.getElementById("digitalTime");
    const dateText = document.getElementById("dateText");
    const scene = document.getElementById("scene");

    let use24Hour = true;
    let paused = false;
    let frozenTime = new Date();

    // Atualiza os ponteiros, a hora digital e a data.
    function updateClock() {
      const now = paused ? frozenTime : new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();
      const twelveHour = hours % 12;

      secondHand.style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minutes * 6 + seconds * 0.1}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${twelveHour * 30 + minutes * 0.5}deg)`;

      digitalTime.textContent = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !use24Hour
      });

      dateText.textContent = now.toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    // Alterna o relógio digital entre 12 e 24 horas.
    document.getElementById("formatButton").addEventListener("click", () => {
      use24Hour = !use24Hour;
      document.getElementById("formatButton").textContent = use24Hour ? "Formato 24h" : "Formato 12h";
      updateClock();
    });

    // Congela ou retoma a passagem do tempo no widget.
    document.getElementById("pauseButton").addEventListener("click", (event) => {
      if (!paused) frozenTime = new Date();
      paused = !paused;
      event.currentTarget.textContent = paused ? "Retomar" : "Pausar";
      updateClock();
    });

    // Alterna as cores do cartão entre o modo claro e o noturno.
    document.getElementById("themeButton").addEventListener("click", (event) => {
      scene.classList.toggle("night");
      event.currentTarget.textContent = scene.classList.contains("night") ? "Modo claro" : "Modo noturno";
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
